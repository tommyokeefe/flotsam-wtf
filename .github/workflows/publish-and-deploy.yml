# On every push to main: build, audit, publish Documents, then deploy production
# through a Vercel deploy hook, deploying even when publishing fails. Vercel's
# own automatic deploys are off for main; ADR 0009 says why.
#
# Secrets (set by hand, #44):
#   ATPROTO_APP_PASSWORD     an app password for the Publication's account
#   ATPROTO_IDENTIFIER       optional; the Publication's DID is used when unset
#   VERCEL_DEPLOY_HOOK_URL   a Vercel deploy hook for main

name: Publish and deploy

on:
  push:
    branches: [main]

# One run at a time, never cancelled part-way: two overlapping publishes can
# create two Documents for one path, which the planner then refuses to guess
# between (see the header of scripts/publish-documents.mjs).
concurrency:
  group: publish-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A production-mode build: VERCEL_ENV is unset here, so Drafts are left
      # out of the manifest (ADR 0004).
      - run: npm run build
      # Its own step so a Draft in the manifest shows as the reason nothing was
      # published. publish:documents runs it again itself.
      - run: npm run audit:manifest
      # A re-run of an older run checks out an older commit, and a checkout
      # gives every file a fresh mtime, so publish-documents' freshness check
      # can't tell. Publishing it would put back old titles and delete newer
      # Posts. Only the run for the tip of main publishes; the deploy below
      # builds the tip either way.
      - name: Check this commit is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $tip, not $GITHUB_SHA; not publishing an older manifest."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      # A step timeout, not a job one: a timed-out step is a failure, which
      # still deploys, and nothing here should read as a cancelled run.
      - run: npm run publish:documents
        if: steps.tip.outputs.latest == 'true'
        timeout-minutes: 10
        env:
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
          ATPROTO_IDENTIFIER: ${{ secrets.ATPROTO_IDENTIFIER }}

  deploy:
    needs: publish
    # Whether or not publish succeeded; only a cancelled run doesn't deploy.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not set, so production was not deployed."
            exit 1
          fi
          curl --max-time 30 --fail --silent --show-error --retry 3 --retry-all-errors -X POST "$HOOK" -o /dev/null
